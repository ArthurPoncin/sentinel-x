# The USB webcam's device node for the vision service, on top of docker-compose.yml. Apart, because
# Docker refuses to create a container whose device node is missing on the host: listed in the main
# file, a laptop without a webcam — or the Pi with it unplugged — could not start the stack at all.
# On the Pi, infra/plug-and-play.sh takes it once it finds a webcam, through these lines in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.camera.yml
#   CAMERA_DEVICE=/dev/v4l/by-id/usb-<the webcam>-video-index0
# and every `docker compose …` then takes both files.
# The node only, never `privileged`: the container sees it and nothing else of /dev, through the
# host's `video` group (group_add in docker-compose.yml), which owns it.
services:
  vision:
    devices:
      # The webcam by its name, whatever USB port it is on and whatever /dev/videoN the host gave it,
      # seen in the container as /dev/video0: CAMERA_SOURCE=opencv:0.
      - ${CAMERA_DEVICE:?the webcam, put in .env by infra/plug-and-play.sh}:/dev/video0
