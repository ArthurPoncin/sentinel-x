# Command Post broker: MQTTS only, every client known, every topic behind the ACL.
# Mounted read-only by docker-compose.yml; the credentials come from infra/secrets/ (setup.sh).

# All interfaces: the table Wi-Fi through the published port, the Compose network as mosquitto:8883.
listener 8883
cafile   /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/auth/broker.crt
keyfile  /mosquitto/config/auth/broker.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/auth/passwd
acl_file      /mosquitto/config/auth/acl

# A command or an Alert is a few hundred bytes: anything bigger is not ours.
max_packet_size 4096

# Live data only: nothing kept on the SD card. Logs go to Docker, which rotates them.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
