; Sentinel firmware (ESP32 DevKitC V4).
; On the Pi, infra/plug-and-play.sh writes include/secrets.h, builds and flashes it over USB.
; By hand: copy include/secrets.example.h to include/secrets.h, fill it in, then `pio run -t upload`.

[env:sentinel]
; Arduino core 2.0.x. Its TLS stack only matches the broker's name against DNS entries of the
; certificate: infra/setup.sh puts the Pi's IP there too.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
