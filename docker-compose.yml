# The Command Post stack, on the Pi. From the repo root, once infra/setup.sh has made the secrets:
#   docker compose up -d --build
# Only the reverse proxy (443) and the broker (8883) are reachable from the table network; the
# rest only talk to each other, on a network with no way out. See infra/README.md.
# The camera's device nodes for vision are in docker-compose.camera.yml, taken on the Pi through
# COMPOSE_FILE in .env (see that file): the stack still starts where there is no camera.

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  reverse-proxy:
    <<: *hardened
    build: infra/caddy
    image: sentinel-x/reverse-proxy
    ports: ["443:8443"]
    volumes:
      - ./infra/secrets/caddy/proxy.crt:/certs/proxy.crt:ro
      - ./infra/secrets/caddy/proxy.key:/certs/proxy.key:ro
    tmpfs: ["/config:mode=1777", "/data:mode=1777"]
    networks: [edge, internal]
    depends_on: [api, dashboard]

  mosquitto:
    <<: *hardened
    image: eclipse-mosquitto:2.0
    user: "1883:1883"
    ports: ["8883:8883"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/secrets/ca.crt:/mosquitto/config/certs/ca.crt:ro
      # broker certificate and key, password file, ACL: readable by the broker only.
      - ./infra/secrets/mosquitto:/mosquitto/config/auth:ro
    networks: [edge, internal]

  api:
    <<: *hardened
    build: backend
    image: sentinel-x/api
    env_file: infra/secrets/api.env
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_USERNAME: api
      MQTT_CA_FILE: /certs/ca.crt
      # MOCK_FEED=true docker compose up -d: the scripted scenario until the Sentinel is there.
      # It is recorded in the history like the real thing.
      MOCK_FEED: ${MOCK_FEED:-false}
    volumes:
      - ./infra/secrets/ca.crt:/certs/ca.crt:ro
      - api-data:/data
    tmpfs: [/tmp]
    networks: [internal]
    depends_on: [mosquitto]

  dashboard:
    <<: *hardened
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: sentinel-x/dashboard
    tmpfs: ["/config:mode=1777", "/data:mode=1777"]
    networks: [internal]

  # The intrusion detector, and the annotated camera feed the reverse proxy serves under /camera,
  # behind the Operator session. Its camera device nodes are in docker-compose.camera.yml: a node
  # missing on the host would stop the whole `docker compose up`. See infra/README.md.
  vision:
    <<: *hardened
    build:
      context: ai
      dockerfile: vision/Dockerfile
    image: sentinel-x/vision
    # The host's `video` group owns the camera nodes (44 on Debian and Raspberry Pi OS:
    # getent group video). The user stays the image's, unprivileged; never `privileged`.
    group_add: ["${VIDEO_GID:-44}"]
    env_file: infra/secrets/vision.env          # VISION_TOKEN
    environment:
      ALERTS_URL: http://api:8080/api/v1/alerts
      # opencv:0, the first V4L2 camera (a USB webcam). The ZIF camera needs Picamera2: #46 makes
      # it the default. Another source: CAMERA_SOURCE in .env (infra/README.md).
      CAMERA_SOURCE: ${CAMERA_SOURCE:-opencv:0}
    networks: [internal]
    depends_on: [api]

  # The predictive model on the live telemetry. Trains on the api's history, read-only:
  #   docker compose run --rm predictive train --from 2026-10-13T08:00:00Z --to 2026-10-13T11:00:00Z
  predictive:
    <<: *hardened
    build:
      context: ai
      dockerfile: predictive/Dockerfile
    image: sentinel-x/predictive
    env_file: infra/secrets/predictive.env      # MQTT_PASSWORD, PREDICTIVE_TOKEN
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_USERNAME: predictive
      MQTT_CA_FILE: /certs/ca.crt
      ALERTS_URL: http://api:8080/api/v1/alerts
    volumes:
      - ./infra/secrets/ca.crt:/certs/ca.crt:ro
      # The api's SQLite history, for `train`: read-only, mode=ro on top. Its files are the api's
      # (node, 0644): readable by everyone, writable by the api only.
      - api-data:/history:ro
      # The model `train` writes and the service reloads by itself.
      - predictive-model:/model
    networks: [internal]
    # The api also for `train`: in WAL mode, a read-only reader needs the -shm file it keeps.
    depends_on: [mosquitto, api]

volumes:
  # The history (SQLite): telemetry and Alerts, for the time-scrubber.
  api-data:
  # The predictive model (predictive train → predictive run).
  predictive-model:

networks:
  # The published ports' side: the table network reaches the proxy and the broker through it.
  edge:
  # Between the services only, no route out.
  internal:
    internal: true
