# The Command Post's images, built for the Pi (linux/arm64) and published on GHCR under the key of the
# code they are built from (infra/images.sh): infra/plug-and-play.sh pulls the one that matches its
# checkout instead of spending half an hour building it on the Pi, and builds only what it cannot pull.
# A key already published is not built again.
#
# The packages are private when first published: their owner makes each one public once (the package's
# settings → Change visibility → Public). Until then the Pi builds them itself, as before.
name: Images

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - dashboard/**
      - ai/**
      - infra/caddy/**
      - infra/images.sh
      - docker-compose.yml
      - .github/workflows/images.yml
  workflow_dispatch:

# One run at a time: the next one finds what this one published, and skips it.
concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [reverse-proxy, api, dashboard, vision, predictive]
    # The Pi's architecture, natively: no emulation, and free for a public repository.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: What to build, and under which name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          export IMAGES_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          context="$(infra/images.sh context "$SERVICE")"
          dockerfile="$(infra/images.sh dockerfile "$SERVICE")"
          {
            echo "name=$(infra/images.sh remote "$SERVICE")"
            echo "context=$context"
            echo "file=$context/$dockerfile"
          } >> "$GITHUB_OUTPUT"

      # The Pi builds what it cannot pull from infra/images.sh, and runs it as docker-compose.yml says:
      # both must build the same thing.
      - name: The same context and Dockerfile as docker-compose.yml
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p infra/secrets && touch infra/secrets/api.env infra/secrets/vision.env infra/secrets/predictive.env
          compose="$(docker compose config --format json | python3 -c '
          import json, sys
          build = json.load(sys.stdin)["services"][sys.argv[1]]["build"]
          print(build["context"], build.get("dockerfile", "Dockerfile"))' "$SERVICE")"
          images="$(realpath "$(infra/images.sh context "$SERVICE")") $(infra/images.sh dockerfile "$SERVICE")"
          if [ "$compose" != "$images" ]; then
            echo "::error::$SERVICE: docker-compose.yml builds \"$compose\", infra/images.sh \"$images\""
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: published
        env:
          NAME: ${{ steps.image.outputs.name }}
        run: |
          if docker manifest inspect "$NAME" >/dev/null 2>&1; then
            echo "$NAME is there already"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.found != 'true'

      - uses: docker/build-push-action@v6
        if: steps.published.outputs.found != 'true'
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}
          # Ties the package to this repository: it shows on its page.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The layers of the last build: a change rebuilds, and the Pi downloads, only what follows it.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
