# The servo that turns the webcam, for the vision service, on top of docker-compose.yml. Apart, like
# docker-compose.camera.yml and for the same reason: Docker refuses to create a container whose
# mount is missing on the host, and a laptop — or a Pi without a servo — has no PWM channel.
# On the Pi, infra/servo.sh sets the channel up once (GPIO 18, exported at each boot), and
# infra/plug-and-play.sh takes this file once it finds the channel, through these lines in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.camera.yml:docker-compose.pan.yml
#   PAN_PWM_CHANNEL=/sys/devices/platform/soc/fe20c000.pwm/pwm/pwmchip0/pwm0
#   PAN_GID=<the group that owns the channel's files: gpio>
# The channel's own directory only, never `privileged`: the container writes the pulse the kernel
# sends to the servo and sees nothing else of /sys/class/pwm, through the host's `gpio` group.
services:
  vision:
    group_add: ["${PAN_GID:?the group of the PWM channel, put in .env by infra/plug-and-play.sh}"]
    volumes:
      - ${PAN_PWM_CHANNEL:?the PWM channel of the servo, put in .env by infra/plug-and-play.sh}:/pwm
    environment:
      PAN_DRIVE: pwm
      PAN_PWM_DIR: /pwm
      # The servo as it is mounted, from .env when it differs from the defaults (ai/vision/.env.example):
      # its travel either way of where the camera rests, the pulse at each end of it, which way up.
      # Empty is unset: the default applies.
      PAN_MIN_DEG: ${PAN_MIN_DEG:-}
      PAN_MAX_DEG: ${PAN_MAX_DEG:-}
      PAN_MIN_US: ${PAN_MIN_US:-}
      PAN_MAX_US: ${PAN_MAX_US:-}
      PAN_INVERT: ${PAN_INVERT:-}
      PAN_SPEED_DEG_S: ${PAN_SPEED_DEG_S:-}
      PAN_DEADBAND_DEG: ${PAN_DEADBAND_DEG:-}
      CAMERA_FOV_DEG: ${CAMERA_FOV_DEG:-}
